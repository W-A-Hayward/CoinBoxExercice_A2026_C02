name: My first GitHub Action
run-name: ${{ github.actor }} is running tests
on: [push]

jobs:
  run-all-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # CHANGED: Runs standard Python unit tests through the coverage tool
      - name: Run coverage collection
        run: python -m coverage run -m unittest discover

      # Generates the HTML folder from the .coverage data file
      - name: Generate coverage report
        run: python -m coverage html

      - name: Save coverage report as artifact
        uses: actions/upload-artifact@v4
        with: 
          name: rapport-couverture
          path: htmlcov/
          retention-days: 1

